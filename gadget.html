
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronics | Hb Market</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Arial,sans-serif;
    background:#f8f8f8;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#e5b83e;
    font-size:25px;
    font-weight:bold;
}

header a{
    color:white;
    text-decoration:none;
}

.hero{
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1498049794561-7780e7231661?w=1400");
    background-size:cover;
    background-position:center;
    padding:90px 20px;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.container{padding:40px 6%}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 8px #ddd;
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{padding:15px}

.price{
    color:#a77b12;
    font-weight:bold;
    margin:10px 0;
}

.description{
    color:#555;
    font-size:14px;
    line-height:1.5;
    margin-bottom:12px;
}

.seller{
    font-size:13px;
    color:#666;
    margin-bottom:12px;
}

.whatsapp{
    display:block;
    background:#168c48;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:11px;
    border-radius:5px;
    margin-top:12px;
}

#emptyMessage,#loadingMessage{
    margin-top:20px;
    color:#777;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:40px;
}

@media(max-width:500px){
    .hero h1{font-size:30px}
    .products{
        grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">HB MARKET.</div>
    <a href="index.html">Home</a>
</header>

<section class="hero">
    <h1>Electronics</h1>
    <p>Explore electronics and gadgets from different sellers.</p>
</section>

<section class="container">
    <h2>Electronics Products</h2>
    <br>

    <div class="products" id="productList"></div>

    <p id="loadingMessage">Loading electronics...</p>
    <p id="emptyMessage" style="display:none;">
        No electronics available yet.
    </p>
</section>

<footer>
    Hb Market | Powered by Hb Tech
</footer>

<script type="module">
import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
"https://bwiuaovtrrsgoewrnkkp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T1HPez6suVsszTQ3b7Tjvw_DM464C3R";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function displayProducts(){

    const list=document.getElementById("productList");
    const loading=document.getElementById("loadingMessage");
    const empty=document.getElementById("emptyMessage");

    list.innerHTML="";
    loading.style.display="block";
    empty.style.display="none";

    const {data,error}=await supabase
        .from("products")
        .select(`
            id,
            seller_id,
            seller_name,
            whatsapp,
            name,
            category,
            description,
            price,
            image_url,
            status,
            created_at
        `)
        .eq("status","published")
        .ilike("category","Electronics")
        .order("created_at",{ascending:false});

    loading.style.display="none";

    if(error){
        console.error("Electronics loading error:",error);
        empty.textContent=
            "Unable to load electronics. Please try again later.";
        empty.style.display="block";
        return;
    }

    if(!data || data.length===0){
        empty.textContent="No electronics available yet.";
        empty.style.display="block";
        return;
    }

    data.forEach(product=>{

        const card=document.createElement("div");
        card.className="product";

        const img=document.createElement("img");
        img.src=product.image_url || "";
        img.alt=product.name || "Electronics product";
        img.loading="lazy";

        img.onerror=()=>{
            img.alt="Product image unavailable";
        };

        const info=document.createElement("div");
        info.className="product-info";

        const name=document.createElement("h3");
        name.textContent=product.name || "Unnamed Product";

        const price=document.createElement("p");
        price.className="price";
        price.textContent=
            "₦"+Number(product.price || 0).toLocaleString("en-NG");

        const description=document.createElement("p");
        description.className="description";
        description.textContent=
            product.description || "No description provided.";

        const seller=document.createElement("p");
        seller.className="seller";
        seller.textContent=
            "Seller: "+(product.seller_name || "Hb Market seller");

        info.append(name,price,description,seller);

        if(product.whatsapp){

            let phone=String(product.whatsapp).replace(/\D/g,"");

            if(phone.startsWith("0")){
                phone="234"+phone.substring(1);
            }

            const contact=document.createElement("a");
            contact.className="whatsapp";
            contact.href="https://wa.me/"+phone;
            contact.target="_blank";
            contact.rel="noopener noreferrer";
            contact.textContent="Contact Seller on WhatsApp";

            info.appendChild(contact);
        }

        card.append(img,info);
        list.appendChild(card);
    });
}

displayProducts();
</script>

</body>
</html>
