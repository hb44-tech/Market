<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Hb Market Admin Approval</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f2f4f8; color: #222; } header { background: #111; color: white; padding: 20px; text-align: center; } .container { max-width: 900px; margin: 25px auto; padding: 15px; } .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 18px; box-shadow: 0 3px 12px #00000010; } input { width: 100%; padding: 13px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 7px; } button { border: 0; padding: 12px 18px; border-radius: 7px; cursor: pointer; font-weight: bold; margin: 5px; } .primary { background: #111; color: white; } .approve { background: #168344; color: white; } .reject { background: #d83232; color: white; } .small { color: #666; font-size: 14px; } .hidden { display: none; } .status { font-weight: bold; color: #b87500; } </style> </head> <body> <header> <h2>Hb Market</h2> <p>Administrator Approval Panel</p> </header> <div class="container"> <div class="card" id="loginSection"> <h3>Administrator Sign In</h3> <label>Email Address</label> <input type="email" id="adminEmail" placeholder="Admin email"> <label>Password</label> <input type="password" id="adminPassword" placeholder="Admin password"> <button class="primary" id="loginBtn">Sign In</button> <p id="loginMessage" class="small"></p> </div> <div id="adminSection" class="hidden"> <div class="card"> <h3>Welcome, Administrator</h3> <p>Review OPay transfers before approving subscriptions.</p> <button class="primary" id="refreshBtn">Refresh Requests</button> <button class="reject" id="logoutBtn">Sign Out</button> </div> <h3>Pending Seller Payments</h3> <div id="requestsList"></div> </div> </div> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"; import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"; import { getFirestore, collection, query, where, getDocs, doc, updateDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyBC2TLysSFPdomHHew59uMXQ58MQMm7PNE", authDomain: "hb-market-2.firebaseapp.com", projectId: "hb-market-2", storageBucket: "hb-market-2.firebasestorage.app", messagingSenderId: "288865400772", appId: "1:288865400772:web:98119250477d3846621691" }; const ADMIN_UID = "9Qsm8ErPKQM59MUrE9gGOOMgRq93"; const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const loginSection = document.getElementById("loginSection"); const adminSection = document.getElementById("adminSection"); const loginMessage = document.getElementById("loginMessage"); const requestsList = document.getElementById("requestsList"); document.getElementById("loginBtn").addEventListener("click", async () => { const email = document.getElementById("adminEmail").value.trim(); const password = document.getElementById("adminPassword").value; if (!email || !password) { loginMessage.textContent = "Enter your email and password."; return; } try { loginMessage.textContent = "Signing in..."; await signInWithEmailAndPassword(auth, email, password); } catch (error) { loginMessage.textContent = "Sign in failed: " + error.message; } }); onAuthStateChanged(auth, async (user) => { if (!user) { loginSection.classList.remove("hidden"); adminSection.classList.add("hidden"); return; } if (user.uid !== ADMIN_UID) { alert("Access denied. Administrator account required."); await signOut(auth); return; } loginSection.classList.add("hidden"); adminSection.classList.remove("hidden"); await loadPendingRequests(); }); async function loadPendingRequests() { requestsList.innerHTML = "<p>Loading requests...</p>"; try { const pendingQuery = query( collection(db, "subscriptions"), where("status", "==", "pending") ); const result = await getDocs(pendingQuery); if (result.empty) { requestsList.innerHTML = "<div class='card'>No pending payment requests.</div>"; return; } requestsList.innerHTML = ""; result.forEach((subscriptionDoc) => { const data = subscriptionDoc.data(); const transactionNumber = data.transactionNumber || data.paymentReference || "Not provided"; const card = document.createElement("div"); card.className = "card"; const heading = document.createElement("h3"); heading.textContent = data.sellerName || "Seller"; const details = document.createElement("p"); details.textContent = "Business: " + (data.businessName || "Not provided") + "\nEmail: " + (data.email || "Not provided") + "\nPhone: " + (data.phone || "Not provided") + "\nPlan: " + (data.planName || "Not provided") + "\nAmount: ₦" + (data.price ?? "Not provided") + "\nTransaction Number: " + transactionNumber; details.style.whiteSpace = "pre-line"; const status = document.createElement("p"); status.className = "status"; status.textContent = "PENDING VERIFICATION"; const approveButton = document.createElement("button"); approveButton.className = "approve"; approveButton.textContent = "Approve Payment"; approveButton.addEventListener("click", () => { approveSubscription(subscriptionDoc.id, data); }); const rejectButton = document.createElement("button"); rejectButton.className = "reject"; rejectButton.textContent = "Reject"; rejectButton.addEventListener("click", () => { rejectSubscription(subscriptionDoc.id); }); card.appendChild(heading); card.appendChild(details); card.appendChild(status); card.appendChild(approveButton); card.appendChild(rejectButton); requestsList.appendChild(card); }); } catch (error) { requestsList.textContent = "Could not load requests: " + error.message; } } async function approveSubscription(subscriptionId, data) { const user = auth.currentUser; if (!user || user.uid !== ADMIN_UID) { alert("Administrator access required."); return; } const days = Number(data.durationDays); if (![30, 365].includes(days)) { alert("Invalid subscription duration."); return; } if (!confirm( "Have you personally verified this OPay payment?" )) return; try { const expiryDate = new Date(); expiryDate.setDate(expiryDate.getDate() + days); await updateDoc(doc(db, "subscriptions", subscriptionId), { status: "approved", activatedAt: serverTimestamp(), approvedAt: serverTimestamp(), approvedBy: user.uid, expiresAt: Timestamp.fromDate(expiryDate) }); alert("Subscription approved successfully."); await loadPendingRequests(); } catch (error) { alert("Approval failed: " + error.message); } } async function rejectSubscription(subscriptionId) { const user = auth.currentUser; if (!user || user.uid !== ADMIN_UID) { alert("Administrator access required."); return; } if (!confirm("Reject this payment request?")) return; try { await updateDoc(doc(db, "subscriptions", subscriptionId), { status: "rejected", rejectedAt: serverTimestamp(), rejectedBy: user.uid }); alert("Payment request rejected."); await loadPendingRequests(); } catch (error) { alert("Rejection failed: " + error.message); } } document.getElementById("refreshBtn").addEventListener( "click", loadPendingRequests ); document.getElementById("logoutBtn").addEventListener( "click", () => signOut(auth) ); </script> </body> </html>
